name: Daily Portfolio Activity

on:
  schedule:
    # Runs at 18:30 UTC = midnight IST (UTC+5:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "Shuvik M"
          git config user.email "mshuvik@gmail.com"

      - name: Update activity log
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          TIME=$(date -u '+%H:%M UTC')
          ENTRY="| $DATE | $TIME | Portfolio kept alive — built with React + Vite |"

          # Create log if it doesn't exist
          if [ ! -f ACTIVITY_LOG.md ]; then
            cat <<'EOF' > ACTIVITY_LOG.md
          # Portfolio Activity Log

          Auto-updated daily to keep the contribution graph active.

          | Date | Time | Note |
          |------|------|------|
          EOF
          fi

          # Append today's entry
          echo "$ENTRY" >> ACTIVITY_LOG.md

      - name: Commit and push
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          git add ACTIVITY_LOG.md
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(log): daily activity update $DATE"
          git push origin main
