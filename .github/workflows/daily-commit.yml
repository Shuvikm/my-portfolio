name: Daily Portfolio Activity

on:
  schedule:
    # Runs at 18:30 UTC = midnight IST (UTC+5:30)
    - cron: '30 18 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git author
        run: |
          git config user.name "Shuvik M"
          git config user.email "mshuvik@gmail.com"

      - name: Fetch GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          USERNAME="Shuvikm"

          # Fetch user profile
          USER_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/$USERNAME")

          # Fetch all public repos (paginated — up to 100)
          REPOS_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/$USERNAME/repos?per_page=100&type=public")

          # Parse values
          FOLLOWERS=$(echo "$USER_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('followers',0))")
          PUBLIC_REPOS=$(echo "$USER_DATA" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('public_repos',0))")
          TOTAL_STARS=$(echo "$REPOS_DATA" | python3 -c "import sys,json; repos=json.load(sys.stdin); print(sum(r.get('stargazers_count',0) for r in repos))")
          TOTAL_FORKS=$(echo "$REPOS_DATA" | python3 -c "import sys,json; repos=json.load(sys.stdin); print(sum(r.get('forks_count',0) for r in repos))")
          TOP_LANGS=$(echo "$REPOS_DATA" | python3 -c "
          import sys, json
          from collections import Counter
          repos = json.load(sys.stdin)
          langs = [r['language'] for r in repos if r.get('language')]
          top = [l for l, _ in Counter(langs).most_common(5)]
          print(','.join(top))
          ")
          LATEST_REPO=$(echo "$REPOS_DATA" | python3 -c "
          import sys, json
          repos = json.load(sys.stdin)
          sorted_repos = sorted(repos, key=lambda r: r.get('pushed_at',''), reverse=True)
          if sorted_repos:
              r = sorted_repos[0]
              print(r.get('name',''))
          ")
          UPDATED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # Write JSON
          mkdir -p public
          cat > public/github-stats.json << EOF
          {
            "username": "$USERNAME",
            "followers": $FOLLOWERS,
            "public_repos": $PUBLIC_REPOS,
            "total_stars": $TOTAL_STARS,
            "total_forks": $TOTAL_FORKS,
            "top_languages": "$(echo $TOP_LANGS | sed 's/,/", "/g')",
            "latest_repo": "$LATEST_REPO",
            "updated_at": "$UPDATED_AT"
          }
          EOF

          echo "Stats fetched: repos=$PUBLIC_REPOS stars=$TOTAL_STARS followers=$FOLLOWERS"

      - name: Update activity log
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          TIME=$(date -u '+%H:%M UTC')
          ENTRY="| $DATE | $TIME | Auto stats update — portfolio kept alive |"

          if [ ! -f ACTIVITY_LOG.md ]; then
            printf "# Portfolio Activity Log\n\nAuto-updated daily.\n\n| Date | Time | Note |\n|------|------|------|\n" > ACTIVITY_LOG.md
          fi

          echo "$ENTRY" >> ACTIVITY_LOG.md

      - name: Commit and push
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          git add public/github-stats.json ACTIVITY_LOG.md
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore(stats): daily auto-update GitHub stats $DATE"
          git push origin main
